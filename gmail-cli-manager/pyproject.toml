[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-cli-manager"
version = "0.1.0"
description = "CLI/TUI Gmail Manager using IMAP/SMTP - No OAuth, No Google Cloud"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Gmail CLI Manager Team" }
]
keywords = ["gmail", "imap", "smtp", "cli", "tui", "email"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: IMAP",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "textual>=0.47.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
gmail-manager = "gmail_manager.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_manager"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
